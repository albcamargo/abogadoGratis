# redis.conf - Redis cache para embeddings + rate limiting
# Ubicación: /opt/qdrant/redis.conf
# Optimizado VPS pequeño con Apache + MariaDB + Qdrant compartiendo RAM

bind 0.0.0.0
protected-mode yes
port 6379

# Persistencia RDB (backup cada hora si hay cambios)
save 3600 1
save 300 100
save 60 10000
dbfilename dump.rdb
dir /data

# Memoria max 200MB (de 256M límite contenedor)
maxmemory 200mb
maxmemory-policy allkeys-lru

# Cache embeddings: clave = hash consulta, valor = vector + resultados
# TTL 24h para embeddings, 1h para resultados RAG
# FastAPI debe hacer: SETEX embedding:{hash} 86400 {vector_json}
# Y: SETEX rag:{vertical}:{hash} 3600 {resultados_json}

# Performance VPS pequeño
hz 10
tcp-keepalive 60
timeout 300

# Logging
loglevel notice
logfile ""

# No AOF para ahorrar I/O (RDB suficiente para cache)
appendonly no

# Seguridad: sin AUTH (solo localhost), pero si quieres:
# requirepass CAMBIA_ESTA_CLAVE_REDIS

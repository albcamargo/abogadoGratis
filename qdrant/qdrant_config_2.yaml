# qdrant_config.yaml - Configuración producción Qdrant para Apache ISPConfig
# Ubicación: /opt/qdrant/qdrant_config.yaml
# Referencia: https://qdrant.tech/documentation/hybrid-cloud/

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/storage/snapshots
  # Optimizado para VPS pequeño con Apache + MariaDB compartiendo RAM
  optimizers:
    default_segment_number: 2
    memmap_threshold: 20000
    indexing_threshold: 10000
    flush_interval_sec: 30
  hnsw_index:
    m: 16
    ef_construct: 100
    full_scan_threshold: 10000
  performance:
    max_search_threads: 2
    max_optimization_threads: 1
    update_rate: 100

service:
  http_port: 6333
  grpc_port: 6334
  enable_cors: false  # Seguridad: solo localhost via Apache
  enable_tls: false   # TLS lo maneja Apache ISPConfig con Let's Encrypt

cluster:
  enabled: false

log_level: INFO

# docker-compose.prod.yml - Abogado Gratis - Producción Final
# Ubuntu 24.04 + ISPConfig + Apache + abogadogratis.corefex.net
# Stack: Qdrant + Redis (cache embeddings) + Backup cron + Watchtower (opcional)
# Ubicación: /opt/qdrant/docker-compose.prod.yml o /opt/abogadogratis/docker-compose.prod.yml
# Uso: cd /opt/qdrant && docker compose -f docker-compose.prod.yml up -d

services:
  # =======================
  # Qdrant - Vector DB con embeddings reales
  # =======================
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: abogadogratis-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"  # REST API solo localhost
      - "127.0.0.1:6334:6334"  # gRPC solo localhost

    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml:ro
      - /var/log/abogadogratis:/var/log/abogadogratis
      - /opt/backups/abogadogratis:/backups  # Para snapshots que backup cron sube

    environment:
      - QDRANT__LOG_LEVEL=INFO

    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "abogadogratis,qdrant"

    networks:
      - abogadogratis-network

  # =======================
  # Redis - Cache para embeddings + rate limiting
  # =======================
  redis:
    image: redis:7.4-alpine
    container_name: abogadogratis-redis
    restart: unless-stopped

    # Solo localhost, FastAPI se conecta 127.0.0.1:6379
    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

    # Configuración optimizada VPS pequeño
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

    networks:
      - abogadogratis-network

  # =======================
  # Backup automático con cron en contenedor
  # =======================
  backup:
    image: alpine:3.20
    container_name: abogadogratis-backup
    restart: unless-stopped

    # Este contenedor hace backup diario de MariaDB + Qdrant snapshots + Redis RDB
    # Usa cron interno, no depende del cron del host

    volumes:
      - qdrant_storage:/qdrant/storage:ro
      - redis_data:/redis/data:ro
      - /opt/backups/abogadogratis:/backups
      - /opt/abogadogratis/api/.env:/app/.env:ro
      - ./backup-cron.sh:/usr/local/bin/backup-cron.sh:ro
      - /var/log/abogadogratis:/var/log/abogadogratis

    environment:
      - BACKUP_DIR=/backups
      - DB_HOST=172.20.0.1  # Host gateway para MariaDB del host (Ubuntu ISPConfig)
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RETENTION_DAYS=7
      - BACKUP_SCHEDULE=0 2 * * *  # 2am diario

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache mysql-client curl redis bash
        echo "0 2 * * * /usr/local/bin/backup-cron.sh >> /var/log/abogadogratis/backup-cron.log 2>&1" | crontab -
        echo "Backup cron instalado: $(crontab -l)"
        crond -f -l 8

    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    networks:
      - abogadogratis-network

  # =======================
  # Opcional: Watchtower para auto-update Qdrant/Redis (descomentar si quieres)
  # =======================
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: abogadogratis-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_SCHEDULE=0 0 4 * * *  # 4am diario revisa updates
  #     - WATCHTOWER_INCLUDE_STOPPED=false
  #     - WATCHTOWER_LABEL_ENABLE=false
  #   command: qdrant redis

networks:
  abogadogratis-network:
    name: abogadogratis-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  qdrant_storage:
    name: abogadogratis-qdrant-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/qdrant_storage
  redis_data:
    name: abogadogratis-redis-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/redis_data
